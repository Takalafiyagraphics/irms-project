<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRMS - Incident Detail</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <div class="content-area">
                <div id="incidentDetail"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const incidentId = urlParams.get('id');
        const isEdit = urlParams.get('edit') === '1';

        if (!incidentId) { window.location.href = 'incidents.html'; }

        function loadIncidentDetail() {
            const incident = DataStore.getIncident(incidentId);
            if (!incident) { window.location.href = 'incidents.html'; return; }

            const workflowStages = ['Detection', 'Identification', 'Containment', 'Eradication', 'Recovery', 'Closure'];
            const workflowProgress = ((incident.workflowStage) / (workflowStages.length - 1)) * 100;

            document.getElementById('incidentDetail').innerHTML = `
                <div class="detail-header">
                    <div class="detail-header-top">
                        <div class="detail-header-title">
                            <h1>${incident.id} — ${incident.title}</h1>
                            <div class="detail-header-meta">
                                <span class="badge ${UI.getSeverityClass(incident.severity)}">${incident.severity}</span>
                                <span class="badge ${UI.getStatusClass(incident.status)}">${incident.status}</span>
                                <span>📅 ${incident.dateDetected} ${incident.timeDetected}</span>
                                <span>👤 ${incident.assignedAnalyst}</span>
                            </div>
                        </div>
                        <div class="detail-header-actions">
                            <button class="btn btn-secondary btn-sm" onclick="window.location.href='incidents.html'">← Back</button>
                            ${incident.status !== 'Closed' ? `
                                <button class="btn btn-primary btn-sm" onclick="advanceWorkflow()">▶ Advance Stage</button>
                                <button class="btn btn-success btn-sm" onclick="resolveIncident()">✓ Resolve</button>
                            ` : ''}
                            ${incident.status === 'Resolved' ? `<button class="btn btn-secondary btn-sm" onclick="closeIncident()">🔒 Close</button>` : ''}
                        </div>
                    </div>
                </div>

                <!-- Workflow Progress -->
                <div class="workflow-container">
                    <h3>📋 Incident Response Workflow</h3>
                    <div class="workflow-steps">
                        <div class="workflow-connector">
                            <div class="workflow-progress" style="width: ${workflowProgress}%"></div>
                        </div>
                        ${workflowStages.map((stage, idx) => `
                            <div class="workflow-step ${idx < incident.workflowStage ? 'completed' : ''} ${idx === incident.workflowStage ? 'active' : ''}">
                                <div class="workflow-step-circle">${idx < incident.workflowStage ? '✓' : idx + 1}</div>
                                <span class="workflow-step-label">${stage}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="detail-grid">
                    <div class="detail-main">
                        <!-- Tabs -->
                        <div class="detail-card">
                            <div class="tabs">
                                <button class="tab-btn active" onclick="switchTab('overview')">Overview</button>
                                <button class="tab-btn" onclick="switchTab('investigation')">Investigation</button>
                                <button class="tab-btn" onclick="switchTab('response')">Response Actions</button>
                                <button class="tab-btn" onclick="switchTab('timeline')">Timeline</button>
                            </div>

                            <!-- Overview Tab -->
                            <div class="tab-content active" id="tab-overview">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Incident Title</label>
                                        <input type="text" id="editTitle" value="${incident.title}" ${!isEdit ? 'disabled' : ''}>
                                    </div>
                                    <div class="form-group">
                                        <label>Incident Type</label>
                                        <select id="editType" ${!isEdit ? 'disabled' : ''}>
                                            <option value="Malware" ${incident.type === 'Malware' ? 'selected' : ''}>Malware</option>
                                            <option value="Phishing" ${incident.type === 'Phishing' ? 'selected' : ''}>Phishing</option>
                                            <option value="Unauthorized Access" ${incident.type === 'Unauthorized Access' ? 'selected' : ''}>Unauthorized Access</option>
                                            <option value="Data Breach" ${incident.type === 'Data Breach' ? 'selected' : ''}>Data Breach</option>
                                            <option value="Ransomware" ${incident.type === 'Ransomware' ? 'selected' : ''}>Ransomware</option>
                                            <option value="Network Attack" ${incident.type === 'Network Attack' ? 'selected' : ''}>Network Attack</option>
                                            <option value="Insider Threat" ${incident.type === 'Insider Threat' ? 'selected' : ''}>Insider Threat</option>
                                            <option value="Denial of Service" ${incident.type === 'Denial of Service' ? 'selected' : ''}>Denial of Service</option>
                                            <option value="Suspicious Activity" ${incident.type === 'Suspicious Activity' ? 'selected' : ''}>Suspicious Activity</option>
                                            <option value="Other" ${incident.type === 'Other' ? 'selected' : ''}>Other</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Severity</label>
                                        <select id="editSeverity" ${!isEdit ? 'disabled' : ''}>
                                            <option value="Low" ${incident.severity === 'Low' ? 'selected' : ''}>Low</option>
                                            <option value="Medium" ${incident.severity === 'Medium' ? 'selected' : ''}>Medium</option>
                                            <option value="High" ${incident.severity === 'High' ? 'selected' : ''}>High</option>
                                            <option value="Critical" ${incident.severity === 'Critical' ? 'selected' : ''}>Critical</option>
                                        </select>
                                    </div>
                                    <div class="form-group">
                                        <label>Status</label>
                                        <select id="editStatus" ${!isEdit ? 'disabled' : ''}>
                                            <option value="Open" ${incident.status === 'Open' ? 'selected' : ''}>Open</option>
                                            <option value="Investigating" ${incident.status === 'Investigating' ? 'selected' : ''}>Investigating</option>
                                            <option value="Contained" ${incident.status === 'Contained' ? 'selected' : ''}>Contained</option>
                                            <option value="Eradicated" ${incident.status === 'Eradicated' ? 'selected' : ''}>Eradicated</option>
                                            <option value="Recovering" ${incident.status === 'Recovering' ? 'selected' : ''}>Recovering</option>
                                            <option value="Resolved" ${incident.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                                            <option value="Closed" ${incident.status === 'Closed' ? 'selected' : ''}>Closed</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group" style="margin-bottom: 20px;">
                                    <label>Description</label>
                                    <textarea id="editDescription" ${!isEdit ? 'disabled' : ''}>${incident.description}</textarea>
                                </div>
                                ${isEdit ? `<button class="btn btn-primary" onclick="saveChanges()">💾 Save Changes</button>` : ''}
                            </div>

                            <!-- Investigation Tab -->
                            <div class="tab-content" id="tab-investigation">
                                <div class="form-group">
                                    <label>Investigation Summary</label>
                                    <textarea id="invSummary" placeholder="Enter investigation summary...">${incident.investigation.summary}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>Findings</label>
                                    <textarea id="invFindings" placeholder="Enter findings...">${incident.investigation.findings}</textarea>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Indicators of Compromise (IOCs)</label>
                                        <textarea id="invIOCs" placeholder="Enter IOCs...">${incident.investigation.iocs}</textarea>
                                    </div>
                                    <div class="form-group">
                                        <label>Suspicious IP Addresses</label>
                                        <textarea id="invIPs" placeholder="Enter suspicious IPs...">${incident.investigation.suspiciousIPs}</textarea>
                                    </div>
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label>Suspicious Domains</label>
                                        <input type="text" id="invDomains" value="${incident.investigation.suspiciousDomains}" placeholder="Enter suspicious domains...">
                                    </div>
                                    <div class="form-group">
                                        <label>File Hashes</label>
                                        <input type="text" id="invHashes" value="${incident.investigation.fileHashes}" placeholder="Enter file hashes...">
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label>Affected Devices</label>
                                    <input type="text" id="invDevices" value="${incident.investigation.affectedDevices}" placeholder="Enter affected devices...">
                                </div>
                                <div class="form-group">
                                    <label>Investigation Notes</label>
                                    <textarea id="invNotes" placeholder="Enter additional notes...">${incident.investigation.notes}</textarea>
                                </div>
                                <button class="btn btn-primary" onclick="saveInvestigation()">💾 Save Investigation</button>
                            </div>

                            <!-- Response Actions Tab -->
                            <div class="tab-content" id="tab-response">
                                <div style="margin-bottom: 20px;">
                                    <h4 style="color: var(--text-primary); margin-bottom: 12px;">Add New Response Action</h4>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>Action Type</label>
                                            <select id="actionType">
                                                <option value="Block IP Address">Block IP Address</option>
                                                <option value="Disable User Account">Disable User Account</option>
                                                <option value="Reset Password">Reset Password</option>
                                                <option value="Isolate Device">Isolate Device</option>
                                                <option value="Remove Malware">Remove Malware</option>
                                                <option value="Block Domain">Block Domain</option>
                                                <option value="Restore Backup">Restore Backup</option>
                                                <option value="Patch System">Patch System</option>
                                                <option value="Monitor Network">Monitor Network</option>
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                        <div class="form-group">
                                            <label>Performed By</label>
                                            <input type="text" id="actionBy" placeholder="Analyst name">
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Description</label>
                                        <textarea id="actionDesc" placeholder="Describe the action taken..."></textarea>
                                    </div>
                                    <button class="btn btn-primary" onclick="addResponseAction()">➕ Add Action</button>
                                </div>

                                <h4 style="color: var(--text-primary); margin-bottom: 12px;">Response Actions Log</h4>
                                <div id="responseActionsList">
                                    ${incident.responseActions.length === 0 ? '<p style="color: var(--text-muted);">No response actions recorded yet.</p>' : 
                                    incident.responseActions.map((action, idx) => `
                                        <div style="background: var(--bg-hover); border-radius: 8px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--border-color);">
                                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                                <span class="badge ${action.status === 'Completed' ? 'badge-status-resolved' : 'badge-status-investigating'}">${action.status}</span>
                                                <span style="font-size: 12px; color: var(--text-muted);">${action.dateTime}</span>
                                            </div>
                                            <h5 style="color: var(--text-primary); font-size: 14px; margin-bottom: 4px;">${action.action}</h5>
                                            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 4px;">${action.description}</p>
                                            <span style="font-size: 12px; color: var(--text-muted);">By: ${action.performedBy}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <!-- Timeline Tab -->
                            <div class="tab-content" id="tab-timeline">
                                <div style="margin-bottom: 20px;">
                                    <h4 style="color: var(--text-primary); margin-bottom: 12px;">Add Timeline Event</h4>
                                    <div class="form-row">
                                        <div class="form-group">
                                            <label>Event Time</label>
                                            <input type="text" id="timelineTime" placeholder="e.g., 10:30 AM">
                                        </div>
                                        <div class="form-group">
                                            <label>Event Type</label>
                                            <select id="timelineType">
                                                <option value="detection">Detection</option>
                                                <option value="alert">Alert</option>
                                                <option value="report">Report</option>
                                                <option value="assign">Assignment</option>
                                                <option value="action">Action</option>
                                                <option value="investigate">Investigation</option>
                                                <option value="contain">Containment</option>
                                                <option value="eradicate">Eradication</option>
                                                <option value="recover">Recovery</option>
                                                <option value="resolve">Resolution</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label>Event Description</label>
                                        <input type="text" id="timelineEvent" placeholder="Describe the event...">
                                    </div>
                                    <button class="btn btn-primary" onclick="addTimelineEvent()">➕ Add Event</button>
                                </div>

                                <div class="timeline" id="timelineContainer">
                                    ${incident.timeline.map((event, idx) => `
                                        <div class="timeline-item">
                                            <div class="timeline-dot ${event.type === 'detection' ? 'red' : event.type === 'action' ? 'orange' : event.type === 'resolve' ? 'green' : 'cyan'}"></div>
                                            <div class="timeline-time">${event.time}</div>
                                            <div class="timeline-content">
                                                <h4>${event.event}</h4>
                                                <p>${event.type.charAt(0).toUpperCase() + event.type.slice(1)}</p>
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="detail-sidebar">
                        <div class="detail-card">
                            <h3><span class="card-icon">📋</span> Incident Info</h3>
                            <div class="detail-info-row"><span class="detail-info-label">Incident ID</span><span class="detail-info-value">${incident.id}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Type</span><span class="detail-info-value">${incident.type}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Severity</span><span class="detail-info-value"><span class="badge ${UI.getSeverityClass(incident.severity)}">${incident.severity}</span></span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Status</span><span class="detail-info-value"><span class="badge ${UI.getStatusClass(incident.status)}">${incident.status}</span></span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Date Detected</span><span class="detail-info-value">${incident.dateDetected} ${incident.timeDetected}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Affected System</span><span class="detail-info-value">${incident.affectedSystem}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Department</span><span class="detail-info-value">${incident.affectedDepartment}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Source</span><span class="detail-info-value">${incident.sourceOfDetection}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Reporter</span><span class="detail-info-value">${incident.reporterName}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Assigned Analyst</span><span class="detail-info-value">${incident.assignedAnalyst}</span></div>
                            <div class="detail-info-row"><span class="detail-info-label">Last Updated</span><span class="detail-info-value">${incident.lastUpdated}</span></div>
                        </div>

                        <div class="detail-card">
                            <h3><span class="card-icon">⚡</span> Quick Actions</h3>
                            <div style="display: flex; flex-direction: column; gap: 8px;">
                                <button class="btn btn-secondary btn-sm" onclick="assignAnalyst()">👤 Assign Analyst</button>
                                <button class="btn btn-secondary btn-sm" onclick="startInvestigation()">🔍 Start Investigation</button>
                                <button class="btn btn-secondary btn-sm" onclick="containIncident()">🛡️ Contain</button>
                                <button class="btn btn-secondary btn-sm" onclick="markEradicated()">🧹 Mark Eradicated</button>
                                <button class="btn btn-secondary btn-sm" onclick="startRecovery()">🔄 Start Recovery</button>
                                <button class="btn btn-success btn-sm" onclick="resolveIncident()">✓ Resolve</button>
                                <button class="btn btn-secondary btn-sm" onclick="closeIncident()">🔒 Close</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tabName).classList.add('active');
        }

        function saveChanges() {
            const updates = {
                title: document.getElementById('editTitle').value,
                type: document.getElementById('editType').value,
                severity: document.getElementById('editSeverity').value,
                status: document.getElementById('editStatus').value,
                description: document.getElementById('editDescription').value
            };
            DataStore.updateIncident(incidentId, updates);
            UI.toast('Incident updated successfully!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function saveInvestigation() {
            const incident = DataStore.getIncident(incidentId);
            incident.investigation = {
                summary: document.getElementById('invSummary').value,
                findings: document.getElementById('invFindings').value,
                iocs: document.getElementById('invIOCs').value,
                suspiciousIPs: document.getElementById('invIPs').value,
                suspiciousDomains: document.getElementById('invDomains').value,
                fileHashes: document.getElementById('invHashes').value,
                affectedDevices: document.getElementById('invDevices').value,
                notes: document.getElementById('invNotes').value
            };
            DataStore.updateIncident(incidentId, { investigation: incident.investigation });
            UI.toast('Investigation saved successfully!', 'success');
        }

        function addResponseAction() {
            const incident = DataStore.getIncident(incidentId);
            const action = {
                action: document.getElementById('actionType').value,
                performedBy: document.getElementById('actionBy').value || 'Unknown',
                dateTime: new Date().toISOString().slice(0, 16).replace('T', ' '),
                description: document.getElementById('actionDesc').value,
                status: 'Completed'
            };
            incident.responseActions.push(action);
            DataStore.updateIncident(incidentId, { responseActions: incident.responseActions });
            UI.toast('Response action added!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function addTimelineEvent() {
            const incident = DataStore.getIncident(incidentId);
            const event = {
                time: document.getElementById('timelineTime').value || new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
                event: document.getElementById('timelineEvent').value,
                type: document.getElementById('timelineType').value
            };
            incident.timeline.push(event);
            DataStore.updateIncident(incidentId, { timeline: incident.timeline });
            UI.toast('Timeline event added!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function advanceWorkflow() {
            const incident = DataStore.getIncident(incidentId);
            const stages = ['Open', 'Investigating', 'Contained', 'Eradicated', 'Recovering', 'Resolved', 'Closed'];
            const currentIdx = stages.indexOf(incident.status);
            if (currentIdx < stages.length - 1) {
                const newStatus = stages[currentIdx + 1];
                const newStage = Math.min(incident.workflowStage + 1, 5);
                DataStore.updateIncident(incidentId, { status: newStatus, workflowStage: newStage });

                // Add timeline event
                incident.timeline.push({
                    time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
                    event: `Status changed to ${newStatus}`,
                    type: newStatus === 'Contained' ? 'contain' : newStatus === 'Eradicated' ? 'eradicate' : newStatus === 'Recovering' ? 'recover' : 'action'
                });
                DataStore.updateIncident(incidentId, { timeline: incident.timeline });

                UI.toast(`Incident advanced to ${newStatus}`, 'success');
                setTimeout(() => window.location.reload(), 800);
            }
        }

        function resolveIncident() {
            DataStore.updateIncident(incidentId, { status: 'Resolved', workflowStage: 5 });
            const incident = DataStore.getIncident(incidentId);
            incident.timeline.push({
                time: new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
                event: 'Incident resolved',
                type: 'resolve'
            });
            DataStore.updateIncident(incidentId, { timeline: incident.timeline });
            UI.toast('Incident resolved!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function closeIncident() {
            DataStore.updateIncident(incidentId, { status: 'Closed', workflowStage: 5 });
            UI.toast('Incident closed!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function assignAnalyst() {
            const name = prompt('Enter analyst name:');
            if (name) {
                DataStore.updateIncident(incidentId, { assignedAnalyst: name });
                UI.toast(`Assigned to ${name}`, 'success');
                setTimeout(() => window.location.reload(), 800);
            }
        }

        function startInvestigation() {
            DataStore.updateIncident(incidentId, { status: 'Investigating', workflowStage: 1 });
            UI.toast('Investigation started!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function containIncident() {
            DataStore.updateIncident(incidentId, { status: 'Contained', workflowStage: 2 });
            UI.toast('Incident contained!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function markEradicated() {
            DataStore.updateIncident(incidentId, { status: 'Eradicated', workflowStage: 3 });
            UI.toast('Threat eradicated!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        function startRecovery() {
            DataStore.updateIncident(incidentId, { status: 'Recovering', workflowStage: 4 });
            UI.toast('Recovery started!', 'success');
            setTimeout(() => window.location.reload(), 800);
        }

        document.addEventListener('DOMContentLoaded', loadIncidentDetail);
    </script>
</body>
</html>
