<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRMS - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <span class="logo-icon">🛡️</span>
            <h1>IRMS</h1>
            <p>Incident Response Management System</p>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username / Email</label>
                <input type="text" class="form-input" id="username" placeholder="Enter username" required value="admin">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="password" placeholder="Enter password" required value="admin123">
            </div>
            <div class="form-check">
                <input type="checkbox" id="rememberMe">
                <label for="rememberMe">Remember me</label>
            </div>
            <button type="submit" class="btn btn-primary">🔐 Login to IRMS</button>
        </form>
        <div class="forgot-password">
            <a href="#" onclick="alert('Password reset link would be sent to your email.')">Forgot Password?</a>
        </div>
        <div style="margin-top: 20px; padding: 12px; background: rgba(6,182,212,0.1); border-radius: 8px; border: 1px solid rgba(6,182,212,0.2);">
            <p style="font-size: 12px; color: var(--text-secondary); text-align: center;">
                <strong>Demo Credentials:</strong><br>
                Username: <code style="color: var(--accent-cyan)">admin</code> | Password: <code style="color: var(--accent-cyan)">admin123</code>
            </p>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (Auth.login(username, password)) {
                window.location.href = 'dashboard.html';
            } else {
                alert('Invalid credentials. Use admin / admin123');
            }
        });
    </script>
</body>
</html>
