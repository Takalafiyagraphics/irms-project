<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRMS - Investigation</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <div class="content-area">
                <div class="search-filters">
                    <div class="search-box">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Search investigations..." onkeyup="filterInvestigations()">
                    </div>
                    <select class="filter-select" id="severityFilter" onchange="filterInvestigations()">
                        <option value="">All Severities</option>
                        <option value="Critical">Critical</option>
                        <option value="High">High</option>
                        <option value="Medium">Medium</option>
                        <option value="Low">Low</option>
                    </select>
                </div>

                <div class="table-card">
                    <div class="table-card-header">
                        <h3>🔍 Active Investigations</h3>
                    </div>
                    <div style="overflow-x: auto;">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Title</th>
                                    <th>Type</th>
                                    <th>Severity</th>
                                    <th>Status</th>
                                    <th>Assigned Analyst</th>
                                    <th>Investigation Summary</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="investigationTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function loadInvestigations() {
            filterInvestigations();
        }

        function filterInvestigations() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const severity = document.getElementById('severityFilter').value;

            const incidents = DataStore.getIncidents().filter(inc => {
                const matchesSearch = !search || 
                    inc.id.toLowerCase().includes(search) ||
                    inc.title.toLowerCase().includes(search) ||
                    inc.investigation.summary.toLowerCase().includes(search);
                const matchesSeverity = !severity || inc.severity === severity;
                return matchesSearch && matchesSeverity;
            });

            const tbody = document.getElementById('investigationTable');
            if (incidents.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><span class="empty-icon">🔍</span><h3>No investigations found</h3></div></td></tr>`;
                return;
            }

            tbody.innerHTML = incidents.map(inc => `
                <tr>
                    <td><strong>${inc.id}</strong></td>
                    <td>${inc.title}</td>
                    <td>${inc.type}</td>
                    <td><span class="badge ${UI.getSeverityClass(inc.severity)}">${inc.severity}</span></td>
                    <td><span class="badge ${UI.getStatusClass(inc.status)}">${inc.status}</span></td>
                    <td>${inc.assignedAnalyst}</td>
                    <td style="max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${inc.investigation.summary || 'No summary yet'}</td>
                    <td><a href="incident-detail.html?id=${inc.id}" class="btn btn-sm btn-secondary">Investigate</a></td>
                </tr>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', loadInvestigations);
    </script>
</body>
</html>
