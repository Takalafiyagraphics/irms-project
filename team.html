<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRMS - Team</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <div class="main-content">
            <div class="content-area">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="color: var(--text-primary);">Security Team</h2>
                    <button class="btn btn-primary" onclick="openAddMemberModal()">➕ Add Member</button>
                </div>

                <div class="team-grid" id="teamGrid"></div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Member Modal -->
    <div class="modal-overlay" id="memberModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Team Member</h3>
                <button class="modal-close" onclick="closeMemberModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="memberId">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="memberName" placeholder="Full name">
                </div>
                <div class="form-group">
                    <label>Role *</label>
                    <select id="memberRole">
                        <option value="SOC Analyst">SOC Analyst</option>
                        <option value="Incident Response Manager">Incident Response Manager</option>
                        <option value="Security Administrator">Security Administrator</option>
                        <option value="Network Administrator">Network Administrator</option>
                        <option value="System Administrator">System Administrator</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="memberEmail" placeholder="email@company.com">
                </div>
                <div class="form-group">
                    <label>Status</label>
                    <select id="memberStatus">
                        <option value="Active">Active</option>
                        <option value="Away">Away</option>
                        <option value="Offline">Offline</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeMemberModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveMember()">Save</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        function loadTeam() {
            const team = DataStore.getTeam();
            const grid = document.getElementById('teamGrid');

            if (team.length === 0) {
                grid.innerHTML = '<div class="empty-state"><span class="empty-icon">👥</span><h3>No team members yet</h3><p>Add your first team member to get started.</p></div>';
                return;
            }

            grid.innerHTML = team.map(member => {
                const initials = member.name.split(' ').map(n => n[0]).join('');
                const statusClass = member.status === 'Active' ? 'badge-status-resolved' : 'badge-status-investigating';
                return '<div class="team-card">' +
                    '<div class="team-avatar">' + initials + '</div>' +
                    '<div class="team-info">' +
                        '<h4>' + member.name + '</h4>' +
                        '<p>' + member.role + '</p>' +
                        '<p style="font-size: 12px; color: var(--text-muted);">' + member.email + '</p>' +
                        '<span class="badge ' + statusClass + '">' + member.status + '</span>' +
                        '<p style="margin-top: 8px; font-size: 12px;">' + member.assignedIncidents + ' assigned incidents</p>' +
                    '</div>' +
                    '<div class="action-btns" style="margin-left: auto;">' +
                        '<button class="action-btn edit" onclick="editMember(' + member.id + ')" title="Edit">✏️</button>' +
                        '<button class="action-btn delete" onclick="deleteMember(' + member.id + ')" title="Delete">🗑</button>' +
                    '</div>' +
                '</div>';
            }).join('');
        }

        function openAddMemberModal() {
            document.getElementById('modalTitle').textContent = 'Add Team Member';
            document.getElementById('memberId').value = '';
            document.getElementById('memberName').value = '';
            document.getElementById('memberRole').value = 'SOC Analyst';
            document.getElementById('memberEmail').value = '';
            document.getElementById('memberStatus').value = 'Active';
            document.getElementById('memberModal').classList.add('active');
        }

        function editMember(id) {
            const team = DataStore.getTeam();
            const member = team.find(m => m.id === id);
            if (!member) return;

            document.getElementById('modalTitle').textContent = 'Edit Team Member';
            document.getElementById('memberId').value = member.id;
            document.getElementById('memberName').value = member.name;
            document.getElementById('memberRole').value = member.role;
            document.getElementById('memberEmail').value = member.email;
            document.getElementById('memberStatus').value = member.status;
            document.getElementById('memberModal').classList.add('active');
        }

        function closeMemberModal() {
            document.getElementById('memberModal').classList.remove('active');
        }

        function saveMember() {
            const id = document.getElementById('memberId').value;
            const team = DataStore.getTeam();

            const memberData = {
                name: document.getElementById('memberName').value.trim(),
                role: document.getElementById('memberRole').value,
                email: document.getElementById('memberEmail').value.trim(),
                status: document.getElementById('memberStatus').value
            };

            if (!memberData.name || !memberData.email) {
                UI.toast('Please fill in all required fields', 'error');
                return;
            }

            if (id) {
                const index = team.findIndex(m => m.id == id);
                if (index !== -1) {
                    team[index] = { ...team[index], ...memberData };
                }
            } else {
                const newId = Math.max(...team.map(m => m.id), 0) + 1;
                team.push({ id: newId, ...memberData, assignedIncidents: 0 });
            }

            DataStore.saveTeam(team);
            UI.toast(id ? 'Member updated!' : 'Member added!', 'success');
            closeMemberModal();
            loadTeam();
        }

        function deleteMember(id) {
            if (confirm('Are you sure you want to remove this team member?')) {
                const team = DataStore.getTeam().filter(m => m.id !== id);
                DataStore.saveTeam(team);
                UI.toast('Member removed', 'success');
                loadTeam();
            }
        }

        document.addEventListener('DOMContentLoaded', loadTeam);
    </script>
</body>
</html>
